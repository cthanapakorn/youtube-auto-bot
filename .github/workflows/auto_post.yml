name: YouTube Auto Bot - Ultimate
on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 🛠️ Install System FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # ✅ แก้ไขตรงนี้: ติดตั้งทุกอย่างให้เสร็จก่อนรัน main.py
      - name: 📦 Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install google-genai edge-tts requests pillow google-api-python-client google-auth-oauthlib

      - name: 🚀 Run Autonomous System
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
        run: python main.py
