name: YouTube Auto Bot - Ultimate
on:
  workflow_dispatch: # กดรันเองได้
  schedule:
    - cron: '0 1 * * *' # รันอัตโนมัติทุกวันตอนเช้า (เลือกเวลาได้)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 🛠️ Install System FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 🚀 Run Autonomous System
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
        run: python main.py

      # หมายเหตุ: ลบส่วน Backup Artifacts ออกตามคำขอ เพื่อป้องกันพื้นที่เต็ม
