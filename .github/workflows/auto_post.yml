name: Auto YouTube Post
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install System FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          
      - name: Install Python Tools
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests edge-tts google-api-python-client google-auth Pillow
          
      - name: Run Script
        env: # เพิ่ม HF_TOKEN บรรทัดล่างนี้ครับ
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python main.py
