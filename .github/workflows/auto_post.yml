name: Auto YouTube Post
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ติดตั้ง FFmpeg แบบเร็วที่สุดในโลก (ใช้เวลาไม่กี่วินาที)
      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
      
      - name: Install Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
