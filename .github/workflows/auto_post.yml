name: Autonomous Viral Shorts Generator

on:
  schedule:
    - cron: '0 2 * * *' 
  workflow_dispatch: 

jobs:
  run-ai-system:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v3

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Install System & Python Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig
          pip install google-genai edge-tts requests pillow google-api-python-client google-auth-oauthlib

      - name: 🚀 Run Autonomous System
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
        run: python main.py

      - name: 💾 Save Output Assets
        run: |
          git config --global user.name "AI-Bot"
          git config --global user.email "bot@ai.local"
          git add -A || true
          git reset -- .github/ || true
          git commit -m "🤖 Auto-saved daily assets" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push || echo "Push skipped"

      - name: 📥 Backup Video File (ดาวน์โหลดคลิปที่นี่)
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: Viral-Shorts-Video
          path: final.mp4
